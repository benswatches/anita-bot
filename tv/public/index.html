<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Anita TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/home" data-focus aria-label="Anita TV home">
      <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="1" y="2" width="30" height="18" rx="5" fill="#e53935"/><rect x="11" y="21" width="10" height="2" rx="1" fill="#e53935"/><path d="M13 7.5v7l6-3.5z" fill="#fff"/></svg>
      <span>Anita<b>TV</b></span>
    </a>
    <nav class="tabs" aria-label="Primary">
      <a href="#/home" data-tab="home" data-focus>Home</a>
      <a href="#/library" data-tab="library" data-focus>Library</a>
      <a href="#/live" data-tab="live" data-focus>Live</a>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="searchBtn" data-focus aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
      </button>
      <div class="avatar" title="Ben">B</div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="modal" id="modal" hidden></div>

  <div class="player" id="player" hidden>
    <video id="video" playsinline preload="auto"></video>
    <div class="signal" id="signal" hidden></div>
    <div class="player-ui" id="playerUi">
      <div class="player-top">
        <button class="icon-btn" id="pBack" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
        </button>
        <div class="p-meta">
          <div class="p-title" id="pTitle"></div>
          <div class="p-sub" id="pSub"></div>
        </div>
        <div class="p-chip" id="pChannel"></div>
      </div>
      <div class="player-bottom">
        <div class="p-timeline" id="pTimeline">
          <div class="p-buffer" id="pAvail"></div>
          <div class="p-progress" id="pProgress"></div>
          <div class="p-thumb" id="pThumb"></div>
        </div>
        <div class="p-times"><span id="pStart"></span><span id="pEnd"></span></div>
        <div class="p-controls">
          <button class="icon-btn" id="pBack15" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-family="Roboto" font-weight="700">15</text></svg></button>
          <button class="icon-btn big" id="pPlay" aria-label="Pause"><svg viewBox="0 0 24 24" id="pPlayIcon"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>
          <button class="icon-btn" id="pFwd15" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-family="Roboto" font-weight="700">15</text></svg></button>
          <button class="live-pill" id="pLive">LIVE</button>
          <span class="spacer"></span>
          <button class="icon-btn" id="pChDown" aria-label="Previous channel"><svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
          <button class="icon-btn" id="pChUp" aria-label="Next channel"><svg viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
          <button class="icon-btn" id="pGuide" aria-label="Mini guide"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h12v2H3z"/></svg></button>
          <button class="icon-btn" id="pRecord" aria-label="Add to library"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
          <button class="icon-btn" id="pMute" aria-label="Mute"><svg viewBox="0 0 24 24" id="pMuteIcon"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02M14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23"/></svg></button>
          <input type="range" id="pVol" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <button class="icon-btn" id="pFull" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg></button>
        </div>
      </div>
      <aside class="mini-guide" id="miniGuide" hidden></aside>
    </div>
    <div class="toast-zone" id="pToast"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
